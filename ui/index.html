<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes"/>

  <!-- Links -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,600,700">
  <!-- Use local CSS files available in ui/css -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar-menu.css?v=1.0">
  <link rel="stylesheet" href="css/custom.css?v=1.3.3">

  <title>Grocery Store</title>
</head>

<body class="tooltips">
  <div class="container">

    <!-- Header -->
    <div class="header content rows-content-header">
      <button class="button-menu-mobile show-sidebar">
        <i class="fa fa-bars"></i>
      </button>
      <div class="navbar navbar-default" role="navigation">
        <div class="container">
          <div class="navbar-collapse collapse">
            <ul class="nav navbar-nav visible-lg visible-md limit-chars">
              <ul class="breadcrumb">
                <a href="index.html">
                  <i class="zmdi zmdi-view-dashboard zmdi-hc-fw" title="Orders"></i>
                </a>
                <a href="manage-product.html">
                  <i class="zmdi zmdi-assignment zmdi-hc-fw" title="Products"></i>
                </a>
              </ul>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <main role="main" class="right content-page">
      <div class="body content rows scroll-y">
        <form class="form-horizontal" action="">
          <div class="box-info full" id="taskFormContainer">
            <h2>Grocery Store Management System</h2>

            <!-- Action Buttons -->
            <div class="row mb-4">
              <div class="col-sm-12" style="text-align: center;">
               <a href="/new-order" class="btn btn-primary">New Order</a>
               <a href="/manage-products" class="btn btn-accent">Manage Products</a>
              </div>
            </div>

            <!-- Orders Table -->
            <table id="orderTable" class="table table-bordered">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Order Number</th>
                  <th>Customer Name</th>
                  <th>Total Cost</th>
                </tr>
              </thead>
              <tbody>
                <!-- Order rows will be injected here -->
              </tbody>
            </table>
          </div>
        </form>
      </div>
    </main>

    <!-- Modals -->
    <div class="modal" id="userProfileModal" role="dialog">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body text-center">
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade-scale" id="myModal" role="dialog" data-backdrop="static">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-body text-center">
            <!-- Inline SVG spinner to avoid external cert/image issues -->
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 50 50'><path fill='%23999' d='M43.935,25.145c0-10.318-8.364-18.682-18.682-18.682c-10.319,0-18.683,8.364-18.683,18.682h4.068c0-8.069,6.546-14.615,14.615-14.615c8.069,0,14.615,6.546,14.615,14.615H43.935z'><animateTransform attributeType='xml' attributeName='transform' type='rotate' from='0 25 25' to='360 25 25' dur='0.9s' repeatCount='indefinite'/></path></svg>' width="40" style="margin: 60px auto;" alt="spinner">
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/custom/common.js"></script>
  <script src="js/custom/dashboard.js"></script>
</body>
</html>
