<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Grocery Store - Manage Products</title>

  <!-- Fonts and Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,600,700" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <!-- Local CSS -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/custom.css?v=1.3.3" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
</head>
<body class="tooltips">
  <div class="container">
    <div class="header content rows-content-header">
      <button class="btn btn-outline-secondary button-menu-mobile show-sidebar">
        <i class="fa fa-bars"></i>
      </button>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <ul class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="index.html" title="Home">
              <i class="zmdi zmdi-view-dashboard zmdi-hc-fw"></i> Home
            </a>
          </li>
          <li class="breadcrumb-item active">Manage Products</li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="right content-page">
    <div class="body content rows scroll-y">
      <div class="box-info full" id="taskFormContainer">
        <h2>Manage Products</h2>
        <div class="panel-body pt-0">
          <div class="row mb-4">
            <div class="col-sm-12">
              <button type="button" class="btn btn-sm btn-primary float-right" id="addProductBtn">
                Add New Product
              </button>
            </div>
          </div>

          <table class="table table-bordered table-hover" id="productsTable">
            <thead>
              <tr>
                <th>Product Name</th>
                <th>Unit of Measurement</th>
                <th>Price per Unit</th>
                <th style="width: 150px">Actions</th>
              </tr>
            </thead>
                <tbody id="productTableBody"></tbody>
              <!-- Product rows injected by js/custom/manage_product.js -->
            </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal fade" id="productModal" role="dialog" data-backdrop="static">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Add / Edit Product</h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <form id="productForm">
          <div class="modal-body">
            <input type="hidden" name="id" id="id" value="0" />
            <div class="form-group">
              <label for="name">Name:</label>
              <input class="form-control" placeholder="Name" name="name" id="name" required autocomplete="off" />
            </div>
            <div class="form-group">
              <label for="uom">Unit of Measurement:</label>
              <select class="form-control" name="uom" id="uom" required autocomplete="off">
                <option value="">Select UOM</option>
              </select>
            </div>
            <div class="form-group">
              <label for="price">Price per Unit:</label>
              <input class="form-control" placeholder="Price" name="price" id="price" required autocomplete="off"/>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success" id="saveProduct">Save</button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Required JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="js/custom/common.js"></script>
  <script src="js/custom/manage_product.js"></script>
  <script src="js/custom/dashboard.js"></script>
</body>
</html>
