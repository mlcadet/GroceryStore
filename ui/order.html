<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="csrf-token" content="kmapods5wQ5L1hn7rcR9OPst7EsN0gC7SrHh3m9K" />

  <title>Grocery Store Order</title>

  <!-- Fonts and Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,600,700" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <!-- Local CSS -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/custom.css?v=1.3.3" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
</head>
<body class="tooltips">
  <div class="container">
    <div class="header content rows-content-header">
      <button class="btn btn-outline-secondary button-menu-mobile show-sidebar">
        <i class="fa fa-bars"></i>
      </button>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <ul class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="index.html" title="Orders">
              <i class="zmdi zmdi-view-dashboard zmdi-hc-fw"></i> Orders
            </a>
          </li>
          <li class="breadcrumb-item">
            <a href="manage_product.html" title="Products">
              <i class="zmdi zmdi-view-dashboard zmdi-hc-fw"></i> Products
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="right content-page">
    <div class="body content rows scroll-y">
      <div class="box-info full" id="taskFormContainer">
        <h2>Manage Products</h2>
        <div class="panel-body pt-0">
          <div class="row mb-4">
            <div class="col-sm-12">
              <button type="button" class="btn btn-sm btn-primary float-right" id="addProductBtn">
                Add New Product
              </button>
            </div>
          </div>
          <table class="table table-bordered table-hover">
            <thead>
              <tr>
                <th>Product Name</th>
                <th>Unit of Measurement</th>
                <th>Price per Unit</th>
                <th style="width: 150px">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Product rows injected here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal fade" id="productModal" role="dialog" data-backdrop="static">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Add New Product</h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <form id="productForm">
          <div class="modal-body">
            <input type="hidden" name="id" id="id" value="0" />
            <div class="form-group">
              <label for="name">Name:</label>
              <input class="form-control" placeholder="Name" name="name" id="name" required />
            </div>
            <div class="form-group">
              <label for="uom">Unit of Measurement:</label>
              <select class="form-control" name="uom" id="uom" required>
                <option value="">Select UOM</option>
              </select>
            </div>
            <div class="form-group">
              <label for="price">Price per Unit:</label>
              <input class="form-control" placeholder="Price" name="price" id="price" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success" id="saveProduct">Save</button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Order Form -->
  <form id="orderForm" class="p-4">
    <div class="form-group">
      <label for="customerName">Customer Name:</label>
      <input type="text" class="form-control" name="customerName" required />
    </div>

    <div class="product-container">
      <div class="row product-box mb-3">
        <div class="col-md-3">
          <select class="form-control cart-product" name="product">
            <!-- Options populated by JS -->
          </select>
        </div>
        <div class="col-md-2">
          <select class="form-control cart-uom" name="uom">
            <option value="">Select UOM</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="number" class="form-control product-qty" name="qty" value="1" min="1" />
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control product-price" readonly />
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control product-total" name="item_total" readonly />
        </div>
        <div class="col-md-1">
          <button type="button" class="btn btn-danger remove-row hideit">Remove</button>
        </div>
      </div>
    </div>

    <div class="form-group mt-3">
      <label for="product_grand_total">Grand Total:</label>
      <input type="text" class="form-control" name="product_grand_total" readonly />
    </div>

    <button type="button" class="btn btn-primary" id="addMoreButton">Add More</button>
    <button type="button" class="btn btn-success" id="saveOrder">Submit Order</button>
  </form>

  <!-- Required JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="js/custom/common.js"></script>
  <script src="js/custom/order.js"></script>
  <script src="js/custom/manage_product.js"></script>
  <script src="js/custom/dashboard.js"></script>
</body>
</html>
